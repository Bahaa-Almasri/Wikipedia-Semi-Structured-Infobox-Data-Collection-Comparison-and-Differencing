services:
  wikinfobox-mongodb:
    image: mongodb/mongodb-community-server:latest
    command: ["--quiet", "--logpath", "/dev/null"]
    container_name: wikinfobox-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared_network

  wikinfobox-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./src:/app
    image: wikinfobox-api:latest
    container_name: ${API_HOST}
    ports:
      - "${API_PORT}:80"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION}
      WIKIPEDIA_BASE_URL: ${WIKIPEDIA_BASE_URL}
      WIKIPEDIA_UN_MEMBER_STATES_URL: ${WIKIPEDIA_UN_MEMBER_STATES_URL}
      WIKIPEDIA_REQUEST_TIMEOUT: ${WIKIPEDIA_REQUEST_TIMEOUT}
      WIKIPEDIA_MAX_RETRIES: ${WIKIPEDIA_MAX_RETRIES}
      WIKIPEDIA_BACKOFF_FACTOR: ${WIKIPEDIA_BACKOFF_FACTOR}
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT}
    depends_on:
      wikinfobox-mongodb:
        condition: service_healthy
    networks:
      - shared_network

  wikinfobox-streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    image: wikinfobox-streamlit:latest
    container_name: wikinfobox-streamlit
    ports:
      - "${STREAMLIT_APP_PORT}:8501"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION}
      WIKIPEDIA_BASE_URL: ${WIKIPEDIA_BASE_URL}
      WIKIPEDIA_UN_MEMBER_STATES_URL: ${WIKIPEDIA_UN_MEMBER_STATES_URL}
      WIKIPEDIA_REQUEST_TIMEOUT: ${WIKIPEDIA_REQUEST_TIMEOUT}
      WIKIPEDIA_MAX_RETRIES: ${WIKIPEDIA_MAX_RETRIES}
      WIKIPEDIA_BACKOFF_FACTOR: ${WIKIPEDIA_BACKOFF_FACTOR}
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT}
      # Streamlit talks to API by service name; API listens on port 80 inside the container.
      API_URL: http://${API_HOST}:80
    depends_on:
      wikinfobox-api:
        condition: service_started
    networks:
      - shared_network

  wikinfobox-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: wikinfobox-frontend:latest
    container_name: wikinfobox-frontend
    ports:
      - "${FRONTEND_PORT:-8990}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite proxies /wikiinfobox to the API container (browser stays on the React origin).
      VITE_PROXY_TARGET: http://${API_HOST}:80
    depends_on:
      wikinfobox-api:
        condition: service_started
    networks:
      - shared_network

networks:
  shared_network:
    name: shared_network

volumes:
  mongodb_data:
